services:
  - type: web
    name: swiftpos-server
    runtime: node
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    plan: starter        # was: free. Free tier sleeps + ~50s cold start = missed M-Pesa callbacks.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # ── Supabase ────────────────────────────────────────────────────────────
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY throw at module scope
      # (lib/supabase.ts:9) — already provisioned.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── BOOT-BLOCKING — the server will not start without these ─────────────
      # Each throws at module scope, before the HTTP listener is created.
      # Audit H10.

      # middleware/adminAuth.ts:24 — throw new Error('Missing ADMIN_JWT_SECRET')
      - key: ADMIN_JWT_SECRET
        sync: false

      # lib/techToken.ts:56 — const _keys = loadSigningKeys() runs at import.
      # With NODE_ENV=production and either key missing it throws
      # "Refusing to start without an explicitly provisioned Ed25519 keypair."
      # Imported by routes/tech.ts and routes/admin.ts, both mounted in index.ts.
      # PEM newlines must be escaped as literal \n — loadSigningKeys() calls
      # .replace(/\\n/g, '\n') on read.
      - key: TECH_SIGNING_PRIVATE_KEY
        sync: false
      - key: TECH_SIGNING_PUBLIC_KEY
        sync: false

      # ── Explicit values — dangerous defaults if left unset ───────────────────

      # routes/mpesa.ts:51 — process.env.MPESA_ENVIRONMENT ?? 'sandbox'
      # Unset points Daraja at the sandbox host AND makes isAllowedCallbackIp()
      # return true unconditionally. A live deploy that forgets this transacts
      # against sandbox with the callback allowlist disabled and looks fine.
      - key: MPESA_ENVIRONMENT
        value: production

      # jobs/etimsRetry.ts:12 — 'none' stops the retry job scheduling entirely.
      # Per-business fiscalisation stays gated on feature_flags.etims_enabled,
      # so this is the outer of two switches. Flip to a real provider only when
      # a client needs KRA signing.
      - key: ETIMS_PROVIDER
        value: none

      # ── At-rest encryption (H9) ─────────────────────────────────────────────
      # AES-256-GCM key for eTIMS cmc_key and M-Pesa consumer_secret/passkey.
      # encryptSecret() fails closed without it. Generate: openssl rand -hex 32
      - key: APP_ENCRYPTION_KEY
        sync: false

      # ── M-Pesa ──────────────────────────────────────────────────────────────
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      # Optional: routes/mpesa.ts:76 falls back to DEFAULT_DARAJA_IPS. Set only
      # if Safaricom's published callback ranges differ from that hardcoded list.
      # - key: MPESA_ALLOWED_IPS
      #   sync: false

      # ── Mail — optional, degrades gracefully ────────────────────────────────
      # lib/mailer.ts:16 guards on presence; unset simply disables outbound mail.
      # Needed for owner notifications (e.g. device_pending) and daily summaries.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false

      # ── App ─────────────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        sync: false
      - key: DASHBOARD_URL
        sync: false

# ── Deliberately NOT set here ─────────────────────────────────────────────────
#
# PORT                     Render injects this. index.ts:12 reads
#                          process.env.PORT ?? 4000. Hardcoding it risks
#                          binding to a port the health check isn't watching.
#
# ADMIN_EMAIL              Read only by scripts/reset-admin.ts, a CLI tool.
# ADMIN_PASSWORD           Pass inline when running it; never store in the
#                          manifest. See the C4 note below.
#
# DAILY_SUMMARY_CRON       jobs/dailySummary.ts:20 defaults to '0 18 * * *'.
#
# ETIMS_BASE_URL           Not read while ETIMS_PROVIDER=none.
# ETIMS_AUTH_TOKEN         Provision alongside the provider when a client
# ETIMS_SALES_PATH         actually needs fiscalisation.
# ETIMS_INIT_PATH
# ETIMS_QR_BASE
# ETIMS_RETRY_CRON
#
# WHATSAPP_* / TWILIO_*    Out of pilot scope.

      # ── ADDED 2026-07-31 (audit H10) ────────────────────────────────────────
      # Diffing every process.env reference in apps/server/src against this
      # manifest found 19 variables the code reads and this file never declared.
      # A deploy from the manifest alone could not start, and several of the gaps
      # were silent rather than loud — see MPESA_ALLOWED_IPS below.
      #
      # lib/env.ts now validates the required set at boot and reports every
      # problem at once instead of dying on the first one.

      # PORT — Render injects this. Declared so it is visible rather than folk
      # knowledge; src/index.ts falls back to 4000.
      - key: PORT
        sync: false

      # M-Pesa callback allowlist. Unset falls back to the built-in Daraja ranges
      # in mpesa.ts, which is usually right but goes stale when Safaricom changes
      # them — and a stale allowlist rejects real callbacks, so orders sit unpaid.
      - key: MPESA_ALLOWED_IPS
        sync: false

      # Manual discount ceiling (lib/discountPolicy). Unset means the built-in
      # default; set it per deployment rather than relying on that.
      - key: MAX_DISCOUNT_PCT
        sync: false

      # Cron schedules. Both have defaults; declared so a deployment can move
      # them without a code change.
      - key: DAILY_SUMMARY_CRON
        sync: false
      - key: ETIMS_RETRY_CRON
        sync: false

      # ── eTIMS (KRA) — only needed when ETIMS_PROVIDER is not 'none' ──────────
      - key: ETIMS_BASE_URL
        sync: false
      - key: ETIMS_AUTH_TOKEN
        sync: false
      - key: ETIMS_SALES_PATH
        sync: false
      - key: ETIMS_INIT_PATH
        sync: false
      - key: ETIMS_QR_BASE
        sync: false

      # ── WhatsApp / Twilio — only needed when WHATSAPP_PROVIDER is set ────────
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

      # ── Admin bootstrap ─────────────────────────────────────────────────────
      # Read by src/scripts/reset-admin.ts, not by the server itself. Present so
      # the first admin can be created without editing anything: migrations no
      # longer seed a default account (audit C4).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
