# CI for SwiftPOS.
#
# Nothing was running on push before this file existed — no type-check, no build,
# no test, no secret scan. Start here; add the E2E suite (e2e/) once it has a
# CI-reachable environment to point at.

name: CI

on:
  # dev is where work lands; main is what the tills run. CI must gate BOTH, and
  # dev especially — a check that only fires on a PR to main lets a broken commit
  # sit on dev for a week, and by then the failure is buried under later work.
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same branch — Render free tier + long installs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches apps/server engines.node
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json
            apps/admin/package-lock.json

      # Each app has its own lockfile — there is no workspace root, so install
      # them separately. (See REVIEW: consolidating these into one pnpm/npm
      # workspace is a recommended follow-up.)
      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Install admin deps
        working-directory: apps/admin
        run: npm ci

      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs server dashboard admin

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json
            apps/admin/package-lock.json

      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Build server
        working-directory: apps/server
        run: npm run build

      # `npm run build` runs `tsc` with noEmitOnError — a type error fails the
      # build and emits nothing (it used to end in `|| true` and could not fail).
      # This assert is belt-and-braces so a green deploy always has an entrypoint.
      - name: Assert server build emitted an entrypoint
        working-directory: apps/server
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js was not emitted — the build silently failed"; exit 1; }
          echo "dist/index.js present ($(wc -c < dist/index.js) bytes)"

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

      - name: Install admin deps
        working-directory: apps/admin
        run: npm ci

      - name: Build admin
        working-directory: apps/admin
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API on a pull_request
    # event, which needs pull-requests: read. The repository default token is
    # contents/metadata/packages read only, so PR #2 (CI #44) died with
    #   403 Resource not accessible by integration  .../pulls/2/commits
    # having scanned NOTHING. Every earlier run was a push event, where the API
    # is never touched — so this gate had been passing for a reason that did not
    # hold on the one event type that gates a merge to main.
    #
    # Scoped to this job rather than the workflow: nothing else here calls the
    # API, and a read-only default is worth keeping wherever it still works.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan commits

      # FIRST, deliberately. This needs no action, no API and no network, so an
      # infrastructure failure cannot skip it. When gitleaks crashed on CI #44
      # the job stopped and this never ran either — one outage silently took out
      # BOTH secret gates at once. Cheap checks go ahead of fragile ones.
      #
      # Fail if a real .env is ever committed.
      - name: Assert no committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Real .env file(s) tracked in git:"; echo "$found"; exit 1
          fi
          echo "No tracked .env files."

      # This repo previously leaked a hardcoded Ed25519 signing key to a public
      # remote (see handoffs/handoff-14-07-2026.md §1), and a service-role key in
      # a packaged zip on 2026-08-08 (register A1). This is the guardrail that
      # makes a repeat fail loudly instead of quietly.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # supabase-js types `.from('x')` as `any`, so tsc is structurally blind to
      # a select or insert naming a column that does not exist. Everything below
      # catches the class tsc cannot: it is the only gate on schema drift.

      # `.catch()` on a PostgrestFilterBuilder throws TypeError at runtime. Fixed
      # and regressed at least three times — see the script header.
      - name: No .catch() on Supabase builders
        run: node scripts/check-supabase-catch.mjs

      # Cross-checks every select/insert against scripts/schema-index.json.
      # NB: regenerate that index whenever the schema changes, or this job
      # silently checks against a stale picture and stops being worth reading.
      - name: Schema audit
        run: python3 scripts/schema-audit.py --strict

      # Postgres vs the till's SQLite. Sync moves DATA only and never reconciles
      # STRUCTURE, so the two schemas drift by hand — `shifts` carried
      # closed_by/close_method locally for months with neither column in Postgres.
      #
      # Fails only on divergence that actually breaks sync: a NOT NULL column
      # with no default that the till cannot fill, or a local-only column on a
      # PUSH table. Both reject /api/sync/push on every pass, so a terminal stops
      # syncing entirely — and it surfaces at 06:00, not at deploy.
      #
      # Warnings (a Postgres column the till simply does not populate) do NOT
      # fail: that is a feature the terminal has not implemented, not a fault.
      #
      # Unlike the audit above, this derives from migrations/*.sql rather than
      # from schema-index.json — that index is hand-maintained and is the very
      # artefact that went stale for eleven days.
      - name: Schema parity (Postgres vs desktop SQLite)
        run: node scripts/schema-parity.mjs

      # schema-parity checks the SET OF COLUMNS but, by its own design note, not
      # their domains. A128 (payments.method) and A129 (orders.order_type) both
      # slipped through as a cloud CHECK/length tighter than the till's free-TEXT
      # column could produce — a value the till emits, silently rejected on sync.
      # This gate compares each push-table value-list CHECK against the reviewed
      # producer set in scripts/push-domain-producers.json.
      - name: Push-table domain parity (cloud CHECK vs what the till emits)
        run: node scripts/check-push-domain-parity.mjs

      # Every table created in a migration must say what its RLS is. Migration 29
      # enabled RLS across the board, then 44 and 45 created three tables that
      # said nothing and went unprotected for a day — and this check's first run
      # also turned up branch_prices, which migration 29 had simply missed since
      # migration 20. verify_rls_coverage.sql tests the real database and is the
      # stronger check, but it needs credentials CI does not have; this needs
      # none, so it actually runs. Run both.
      - name: RLS coverage (migrations)
        run: node scripts/check-rls-coverage.mjs

      # THE DRIFT GATE ITSELF. This job has been called "Schema drift" since it
      # was written and did not run check-schema-drift.mjs — the script was
      # referenced nowhere outside its own header. A green tick reading "Schema
      # drift" therefore meant the drift gate had NOT run, which is a worse
      # failure than an absent job: it answers the question before anyone asks
      # it. Cast safety, function-signature drift, duplicate declarations and
      # index freshness are all checked here and nowhere else.
      #
      # refresh-schema-index.mjs stays OUT of CI deliberately. The gate must
      # compare against the COMMITTED snapshots, so a PR that changes the schema
      # without refreshing them fails. Refreshing here would make it pass by
      # rewriting the thing it is measuring against.
      - name: Schema drift
        run: node scripts/check-schema-drift.mjs

      # A table written under one name and read under another. The live schema
      # carries both `stock` and `stock_levels`; every sale wrote stock_levels
      # while the low-stock alert read `stock`, so the alert queried a table
      # nothing had written since the two diverged and returned silently. Every
      # gate above stayed green throughout — both tables exist with valid
      # columns, so the query was legal. Nothing compared WHO WRITES a table
      # against WHO READS it. This does.
      - name: Table read/write parity
        run: node scripts/check-table-usage.mjs

      # The Electron till and the web POS post to the same routes from two
      # separate codebases, and nothing compared their payloads. pump_id was
      # wired end-to-end on the till and never added to the web builder, so
      # every web fuel sale wrote NULL, the exact-tank deduction never fired and
      # fuel reports read zero — the symptom the till fix was written to close.
      # Fails when the server reads a field exactly one client sends.
      - name: Client payload parity (desktop vs web)
        run: node scripts/check-client-parity.mjs

      # The parser is regex-based, so its own failure mode is finding nothing and
      # reporting perfect parity. It exits 2 below its parse floor; this asserts
      # that guard is alive rather than trusting it.
      - name: Assert parity guard detects a broken parse
        run: |
          if PARITY_MIN_SHARED=999 node scripts/schema-parity.mjs > /dev/null 2>&1; then
            echo "parity guard did not fire — it would pass on a broken parse"
            exit 1
          fi

      # Every endpoint the dashboard calls must exist on the server with a
      # matching method. A renamed route or GET-called-as-POST otherwise 404/405s
      # only in the browser. (A133 review surfaced this class was unchecked.)
      # No deps: pure file parsing, so it runs in this job. The DB-backed schema
      # drift gate needs PGlite and runs in server-suites, after the root install.
      - name: API route contract (dashboard vs server)
        run: node scripts/check-api-routes.mjs

      # Regex parser: assert it still detects an injected break rather than
      # trusting a green that could mean "found nothing".
      - name: Assert API route guard detects injected drift
        run: node scripts/check-api-routes.mjs --self-test

  server-suites:
    # tests/*.test.mjs — 18 suites covering the money paths (atomic order, tip
    # reconciliation, /pay claim-and-loyalty, stock effects parity, discount
    # ceiling, offline dating) and the auth resolution bugs.
    #
    # NONE of these ran in CI until 2026-08-09. They were written one per
    # incident, passed on the author's machine, and were then never executed
    # again — so every one of them was decoration the moment its session ended.
    # A test nothing runs is worth about as much as no test (rule 10).
    #
    # These are offline model/unit suites: no server, no database, no secrets.
    # tests/suites/ and tests/runner.mjs are the INTEGRATION half and are
    # deliberately excluded — they need a live API and owner credentials.
    name: Server suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      # order-error-classification imports apps/server/dist, so that it drives
      # the SHIPPED classifier rather than a copy of it that can drift.
      - name: Build server
        working-directory: apps/server
        run: npm run build

      # EVERY migration test, against a real Postgres. PGlite is Postgres
      # compiled to WASM — real parser, planner and DDL semantics, in-process.
      #
      # This repository has tested migrations this way since migration 41 and
      # had six such scripts by 2026-08-10, none of which ran in CI. The cost
      # was exactly what a test nothing invokes always costs:
      #   * test-migration-47.mjs pointed at an absolute sandbox path and had
      #     never run since the day it was committed — 19 dead assertions.
      #   * Migration 74 shipped a CREATE OR REPLACE VIEW that Postgres refuses
      #     (42P16) and reached the owner's database.
      #
      # The runner discovers scripts/test-migration*.mjs rather than listing
      # them, so a new one is covered by existing.
      - name: Migrations against real Postgres
        run: |
          npm install --no-audit --no-fund
          npm run test:migrations

      # Server DB refs (supabase.from/.rpc/filter-columns) vs the schema the
      # migrations build in PGlite. Runs here because it needs the root install
      # above (@electric-sql/pglite). Found stock_movements.business_id and
      # users.pin (A136); self-test asserts the guard still detects injected drift.
      - name: API schema drift (server DB refs vs migrations)
        run: |
          node scripts/check-api-schema-drift.mjs
          node scripts/check-api-schema-drift.mjs --self-test

      - name: Run offline suites
        run: |
          set -e
          fail=0
          for f in tests/*.test.mjs; do
            echo "── $f"
            node --no-warnings "$f" || fail=1
          done
          exit $fail

  desktop-scope:
    name: Desktop row scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20, for node:sqlite — the rejection-routing test needs a real
          # SQLite and better-sqlite3's native binding cannot be built in every
          # environment. The two lint guards below run on either.
          node-version: 24

      # The executable tests below prefer better-sqlite3 — the driver the till
      # actually runs — and fall back to node:sqlite only if it is missing. CI
      # installs it so the assertions are proved against the real engine rather
      # than a compatible one. --no-save keeps it out of the manifest; it is a
      # test dependency of the checks, not of the product.
      - name: Install the app's SQLite driver for the tests
        run: npm i --no-save better-sqlite3

      # Both guards below exist because a till acting as the branch node ingests
      # its peers' rows into the SAME tables that drive its own cash control.
      # Neither failure is visible to tsc, and both appear on exactly one till
      # per branch — which is to say a client finds them, not us.

      # Every query on a replicated table must either scope to this terminal or
      # carry `-- branch-wide: <why>`. getOpenShift() is the reason: unscoped, it
      # returns the newest open drawer anywhere at the branch, and the sell gate
      # reads it.
      - name: Own-row scope declared
        run: node scripts/check-own-rows.mjs

      # Scoping a query means adding a `?`. Adding a `?` without an argument
      # type-checks perfectly and then throws "Too few parameter values were
      # provided" at runtime. Eleven such statements reached the repo on the
      # first pass of the scoping work, and every one on the cash-push path.
      - name: SQL placeholders are bound
        run: node scripts/check-sql-binds.mjs

      # A scoped SELECT and an unattributed INSERT are each individually correct
      # and only wrong together, which is the shape no single-statement check
      # catches. Schema 44 scoped every read of expenses and float_transactions on
      # device_id and left both INSERT sites not setting it — so from that upgrade
      # on, expenses and drawer floats silently stopped reaching the server.
      - name: Replicated rows are attributed
        run: node scripts/check-row-attribution.mjs

      # The rejection block, executed. The server names the table a refused row
      # belongs to; applying every rejection to `shifts` matched zero rows for a
      # business_day, raised nothing, and the row was then marked synced — a
      # refused trading day recorded as delivered and never retried. No lint or
      # type-check can see that. This runs it.
      - name: Sync rejection routing
        run: node --no-warnings scripts/test-sync-rejection-routing.mjs

      # The ingest rules, executed. Every one of them is a case where continuing
      # would produce a plausible and incorrect number rather than an error — a
      # peer's shift attributed to the node, a cursor that skips a row, a counter
      # derived from another terminal's sequence. None is visible to a type-check.
      - name: Branch replication ingest
        run: node --no-warnings scripts/test-node-ingest.mjs

      # Phase 4: instruction lifecycle for the central day close — re-offered
      # until acked, replace-not-stack, idempotent executor, authority model.
      - name: Central day close
        run: node --no-warnings scripts/test-branch-close.mjs

      # Tech DB console + wipe gates + pump attribution: readonly enforcement,
      # source-column secret masking, session gating, audit-before-run.
      - name: Tech console and wipe gates
        run: node --no-warnings scripts/test-tech-db-console.mjs

      # Phase 2a: distribution — requester exclusion, origin fidelity,
      # per-origin cursor resume, bounded catch-up.
      - name: Branch distribution
        run: node --no-warnings scripts/test-node-distribution.mjs

      # Phase 2b: mutations as events — whitelist boundary (no event can write
      # device_id/seq/id/sync_status into a replica), idempotent origin-only
      # applier, out-of-order tolerance.
      - name: Mutation events
        run: node --no-warnings scripts/test-events.mjs

      # Phase 2c: replica pruning boundaries (own rows immortal, unapplied
      # events owed, node keeps everything) and real restorable snapshots.
      - name: Replica maintenance
        run: node --no-warnings scripts/test-maintenance.mjs

      # Phase 3: the office role (serves the branch, cannot sell — refused in
      # main) and the promotion lever (gated, audited, probe-before-save).
      - name: Office role and promotion
        run: node --no-warnings scripts/test-office-role.mjs

      # Field bug: a wedged spooler froze the printer settings screen forever.
      # Every layer now owns its own hang ceiling; Re-detect stays pressable.
      - name: Print resilience
        run: node --no-warnings scripts/test-print-resilience.mjs

      # Field bug: the stations feature existed at every layer EXCEPT the
      # preload bridge — the screen crashed on first use and the kitchen could
      # not be routed. tsc cannot see a bridge gap; this can, both directions.
      - name: IPC bridge parity
        run: node scripts/check-ipc-parity.mjs

      # A38: syncEngine declared 'x-device-id' AND 'X-Device-Id' in one object.
      # Header names are case-insensitive to HTTP but not to an object literal,
      # so fetch sent both and every server reader got them comma-joined —
      # breaking fleet telemetry, orders.device_id, shifts.device_id and the
      # terminal key behind migration 63's one-open-drawer index. Invisible by
      # inspection: both keys look right and TypeScript sees two distinct strings.
      - name: Header keys are declared once
        run: node scripts/check-header-keys.mjs

      # A31: failover-cursors.test.mjs was written, committed, and never added to
      # test:desktop — 92 tests ran on the target and the sixth suite was silently
      # absent. A32: test-migration-47.mjs pointed at a sandbox path and had never
      # executed once. Both looked like coverage.
      - name: Every test file is invoked
        run: node scripts/check-test-registration.mjs

      # A comment must not cite a document that is not in the tree.
      # BRANCH_AUTHORITY_AND_SYNC_DESIGN.md was cited BY SECTION in six source
      # files and existed in neither the repo nor its history (A39) — and it
      # specified most of what the register spent a week rediscovering. A
      # citation a reader cannot follow is worse than none: it looks present.
      #
      # Currently FAILS on three documents the owner is restoring. Once they
      # land this stays green, and the next dangling citation fails the build
      # the day it is written.
      # A47: manageFetch attached a bearer token to 35 manager-screen handlers
      # and had no 401 branch, while ownerFetch forty lines earlier in the same
      # file always had one. The staff access token lives 15 minutes and its
      # refresh token 30 days, so the first manager action after idling reported
      # "This till was signed out" on a till that was signed in. Selling was
      # unaffected — the sync engine refreshes on its own token — which is why
      # it looked intermittent and took a field report to find.
      #
      # This asserts only that expiry was CONSIDERED. Whether the retry is
      # correct is asserted by apps/desktop/test/manage-fetch-refresh.test.mjs,
      # which can drive the decision; a source scan claiming more would be
      # pretending to knowledge it does not have.
      - name: Authenticated fetches handle 401
        run: node scripts/check-auth-retry.mjs

      # A50: daily summaries were never delivered — nine businesses, every run,
      # both observed days. The SMTP fallback died as ENETUNREACH on Google's
      # IPv6 because the transport set no address family. Silent, because
      # dailySummary catches per business and moves on. This pins the IPv4
      # setting against a real nodemailer transport, and pins the boot check
      # that makes a dead mail path announce itself.
      - name: Mailer transport and boot readiness
        run: node --no-warnings tests/mailer-transport.test.mjs

      - name: Cited documents exist
        run: node scripts/check-doc-refs.mjs

      # A45: the Receipt tab was shown on isManagerRole while the cloud demanded
      # settings.manage. Ratcheted, not pass/fail — the ground is not green yet
      # (6 unregistered, 6 ungated, 2 phantom) and a gate nobody can make green
      # gets switched off. See scripts/permission-parity-baseline.json.
      - name: Permission keys agree across cloud, migrations and UI
        run: node scripts/check-permission-parity.mjs

      # A60: nine audit IDs had two entries with contradictory statuses, and the
      # header claimed 0 P0 while A17 sat OPEN at P0. Also ratchets A53's orphan
      # audit-ID citations, which may shrink and may never grow.
      - name: Register agrees with itself
        run: node scripts/check-register-consistency.mjs

      # ── Desktop suites that do NOT need Electron ────────────────────────────
      # 92 desktop tests were added on 2026-08-08 and none of them ran here, so
      # the newest and riskiest code on the till — offline sign-in, credentials
      # at rest, held orders — was guarded only by a command someone had to
      # remember to type on a Windows box.
      #
      # These three are plain node and run anywhere. The other three
      # (heldOrders, pinCache, tokenStore) drive better-sqlite3, which
      # postinstall builds against ELECTRON's ABI (NODE_MODULE_VERSION 133),
      # so plain node cannot load them at all — ERR_DLOPEN_FAILED, by design.
      # They stay a target-machine step via `npm run test:desktop`, and this
      # comment exists so the next person does not "fix" that by adding them.
      #
      # THEY IMPORT dist/main, SO THE BUILD BELOW IS NOT OPTIONAL. CI #42 failed
      # with "dist/main not built" because these steps were added without it;
      # `npm run test:desktop` builds first locally, which is why it passed there
      # and not here.
      #
      # --ignore-scripts and ELECTRON_SKIP_BINARY_DOWNLOAD keep this to a
      # typecheck-sized install: the Electron binary is ~100MB and nothing in
      # this job launches it. shared/printing is a project reference of
      # tsconfig.main.json and declares "types": ["node"], so it needs its own
      # node_modules or the build fails on a missing type definition.
      - name: Install shared/printing (project reference)
        working-directory: shared/printing
        run: npm ci --ignore-scripts

      - name: Install desktop deps (no Electron binary)
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build desktop main
        working-directory: apps/desktop
        run: npx tsc -b tsconfig.main.json --force

      - name: Desktop durable logging
        working-directory: apps/desktop
        run: node --no-warnings test/logFile.test.mjs

      - name: Desktop sync failure reporting
        working-directory: apps/desktop
        run: node --no-warnings test/syncEngine-failures.test.mjs

      # Runs here on node:sqlite — a STAND-IN, and the suite says so in its own
      # output rather than implying a hardware-equivalent green. It still catches
      # a broken cursor reset, which is the point. The real ABI run is
      # `npm run test:failover:electron` on a Windows till, wired into
      # `test:desktop` so it cannot be forgotten the way it was on 2026-08-10.
      - name: Desktop failover cursors (stand-in driver)
        working-directory: apps/desktop
        run: node --no-warnings test/failover-cursors.test.mjs

      # manageFetch serves 35 manager-screen handlers and had no 401 branch,
      # while ownerFetch in the same file always had one. The staff access token
      # lives 15 minutes, so the first manager action after idling reported
      # "This till was signed out" on a till that was signed in. Field report,
      # 0.5.27. Plain node — no Electron, no SQLite.
      - name: Desktop manager-screen token refresh
        working-directory: apps/desktop
        run: node --no-warnings test/manage-fetch-refresh.test.mjs

      # The receipt closing block — thank-you, TAX RECEIPT, credit. It lived
      # only in the HTML receipt, which 0.5.27 deleted (D8), so both lines
      # vanished from the paper a customer is handed. Drives the real renderer
      # at both paper widths.
      # A51: syncAll ran every 10 minutes against a 15-minute token with purely
      # reactive refresh, so every SECOND catalogue pull 401'd by construction —
      # ~72 refresh rotations a day and a till log in which a real auth failure
      # was indistinguishable from noise. Scoped to the DEVICE token: refreshing
      # the staff token ahead of time would mask A47's field test.
      - name: Device token proactive refresh
        working-directory: apps/desktop
        run: node --no-warnings test/device-token-refresh.test.mjs

      # A52: the idle lock. OS idle (powerMonitor) rather than renderer activity,
      # so it cannot fire mid-sale by construction. Asserts the curtain never
      # clears the cart or the session, that unlock is the PIN pad and not the
      # owner login (A17), and that only the locked staff member can dismiss it.
      - name: Idle lock
        working-directory: apps/desktop
        run: node --no-warnings test/idle-lock.test.mjs

      - name: Receipt closing block
        working-directory: shared/printing
        run: npm test
