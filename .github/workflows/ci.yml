      # files and existed in neither the repo nor its history (A39) — and it
      # specified most of what the register spent a week rediscovering. A
      # citation a reader cannot follow is worse than none: it looks present.
      #
      # Currently FAILS on three documents the owner is restoring. Once they
      # land this stays green, and the next dangling citation fails the build
      # the day it is written.
      # A47: manageFetch attached a bearer token to 35 manager-screen handlers
      # and had no 401 branch, while ownerFetch forty lines earlier in the same
      # file always had one. The staff access token lives 15 minutes and its
      # refresh token 30 days, so the first manager action after idling reported
