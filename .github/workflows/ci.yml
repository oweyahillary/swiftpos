# CI for SwiftPOS.
#
# Nothing was running on push before this file existed — no type-check, no build,
# no test, no secret scan. Start here; add the E2E suite (e2e/) once it has a
# CI-reachable environment to point at.

name: CI

on:
  # dev is where work lands; main is what the tills run. CI must gate BOTH, and
  # dev especially — a check that only fires on a PR to main lets a broken commit
  # sit on dev for a week, and by then the failure is buried under later work.
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same branch — Render free tier + long installs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches apps/server engines.node
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json
            apps/admin/package-lock.json

      # Each app has its own lockfile — there is no workspace root, so install
      # them separately. (See REVIEW: consolidating these into one pnpm/npm
      # workspace is a recommended follow-up.)
      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Install admin deps
        working-directory: apps/admin
        run: npm ci

      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs server dashboard admin

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json
            apps/admin/package-lock.json

      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Build server
        working-directory: apps/server
        run: npm run build

      # `npm run build` runs `tsc` with noEmitOnError — a type error fails the
      # build and emits nothing (it used to end in `|| true` and could not fail).
      # This assert is belt-and-braces so a green deploy always has an entrypoint.
      - name: Assert server build emitted an entrypoint
        working-directory: apps/server
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js was not emitted — the build silently failed"; exit 1; }
          echo "dist/index.js present ($(wc -c < dist/index.js) bytes)"

      # A525: the server's production dependencies may carry no high or critical vulnerability (0 after the nodemailer
      # 10.0.16 upgrade). From the lockfile, so it needs no install. The other apps and the daily report:
      # .github/workflows/security-scan.yml (the admin portal's System page).
      - name: Server dependency audit
        working-directory: apps/server
        run: npm audit --omit=dev --audit-level=high --package-lock-only

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

      - name: Install admin deps
        working-directory: apps/admin
        run: npm ci

      - name: Build admin
        working-directory: apps/admin
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API on a pull_request
    # event, which needs pull-requests: read. The repository default token is
    # contents/metadata/packages read only, so PR #2 (CI #44) died with
    #   403 Resource not accessible by integration  .../pulls/2/commits
    # having scanned NOTHING. Every earlier run was a push event, where the API
    # is never touched — so this gate had been passing for a reason that did not
    # hold on the one event type that gates a merge to main.
    #
    # Scoped to this job rather than the workflow: nothing else here calls the
    # API, and a read-only default is worth keeping wherever it still works.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan commits

      # FIRST, deliberately. This needs no action, no API and no network, so an
      # infrastructure failure cannot skip it. When gitleaks crashed on CI #44
      # the job stopped and this never ran either — one outage silently took out
      # BOTH secret gates at once. Cheap checks go ahead of fragile ones.
      #
      # Fail if a real .env is ever committed.
      - name: Assert no committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Real .env file(s) tracked in git:"; echo "$found"; exit 1
          fi
          echo "No tracked .env files."

      # This repo previously leaked a hardcoded Ed25519 signing key to a public
      # remote (see handoffs/handoff-14-07-2026.md §1), and a service-role key in
      # a packaged zip on 2026-08-08 (register A1). This is the guardrail that
      # makes a repeat fail loudly instead of quietly.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # supabase-js types `.from('x')` as `any`, so tsc is structurally blind to
      # a select or insert naming a column that does not exist. Everything below
      # catches the class tsc cannot: it is the only gate on schema drift.

      # `.catch()` on a PostgrestFilterBuilder throws TypeError at runtime. Fixed
      # and regressed at least three times — see the script header.
      - name: No .catch() on Supabase builders
        run: node scripts/check-supabase-catch.mjs

      # Cross-checks every select/insert against scripts/schema-index.json.
      # NB: regenerate that index whenever the schema changes, or this job
      # silently checks against a stale picture and stops being worth reading.
      - name: Schema audit
        run: python3 scripts/schema-audit.py --strict

      # Postgres vs the till's SQLite. Sync moves DATA only and never reconciles
      # STRUCTURE, so the two schemas drift by hand — `shifts` carried
      # closed_by/close_method locally for months with neither column in Postgres.
      #
      # Fails only on divergence that actually breaks sync: a NOT NULL column
      # with no default that the till cannot fill, or a local-only column on a
      # PUSH table. Both reject /api/sync/push on every pass, so a terminal stops
      # syncing entirely — and it surfaces at 06:00, not at deploy.
      #
      # Warnings (a Postgres column the till simply does not populate) do NOT
      # fail: that is a feature the terminal has not implemented, not a fault.
      #
      # Unlike the audit above, this derives from migrations/*.sql rather than
      # from schema-index.json — that index is hand-maintained and is the very
      # artefact that went stale for eleven days.
      - name: Schema parity (Postgres vs desktop SQLite)
        run: node scripts/schema-parity.mjs

      # schema-parity checks the SET OF COLUMNS but, by its own design note, not
      # their domains. A128 (payments.method) and A129 (orders.order_type) both
      # slipped through as a cloud CHECK/length tighter than the till's free-TEXT
      # column could produce — a value the till emits, silently rejected on sync.
      # This gate compares each push-table value-list CHECK against the reviewed
      # producer set in scripts/push-domain-producers.json.
      - name: Push-table domain parity (cloud CHECK vs what the till emits)
        run: node scripts/check-push-domain-parity.mjs

      # Every table created in a migration must say what its RLS is. Migration 29
      # enabled RLS across the board, then 44 and 45 created three tables that
      # said nothing and went unprotected for a day — and this check's first run
      # also turned up branch_prices, which migration 29 had simply missed since
      # migration 20. verify_rls_coverage.sql tests the real database and is the
      # stronger check, but it needs credentials CI does not have; this needs
      # none, so it actually runs. Run both.
      - name: RLS coverage (migrations)
        run: node scripts/check-rls-coverage.mjs

      # THE DRIFT GATE ITSELF. This job has been called "Schema drift" since it
      # was written and did not run check-schema-drift.mjs — the script was
      # referenced nowhere outside its own header. A green tick reading "Schema
      # drift" therefore meant the drift gate had NOT run, which is a worse
      # failure than an absent job: it answers the question before anyone asks
      # it. Cast safety, function-signature drift, duplicate declarations and
      # index freshness are all checked here and nowhere else.
      #
      # refresh-schema-index.mjs stays OUT of CI deliberately. The gate must
      # compare against the COMMITTED snapshots, so a PR that changes the schema
      # without refreshing them fails. Refreshing here would make it pass by
      # rewriting the thing it is measuring against.
      - name: Schema drift
        run: node scripts/check-schema-drift.mjs

      # A table written under one name and read under another. The live schema
      # carries both `stock` and `stock_levels`; every sale wrote stock_levels
      # while the low-stock alert read `stock`, so the alert queried a table
      # nothing had written since the two diverged and returned silently. Every
      # gate above stayed green throughout — both tables exist with valid
      # columns, so the query was legal. Nothing compared WHO WRITES a table
      # against WHO READS it. This does.
      - name: Table read/write parity
        run: node scripts/check-table-usage.mjs

      # A407 — nothing may sign a till out by accident: every revoke of refresh tokens names one token or session, goes
      # through lib/tillSessions.ts (never a till), or says why it is till-safe. (A415: a till's own session names no person.)
      - name: No revoke can sign out a till
        run: node scripts/check-till-sessions.mjs

      # A409 — a row the database refuses is a 500 the user reads as "Something went wrong". Every insert into a table
      # whose business_id is NOT NULL (scripts/schema-index.json) must say business_id.
      - name: Inserts carry business_id
        run: node scripts/check-insert-business-id.mjs

      # The Electron till and the web POS post to the same routes from two
      # separate codebases, and nothing compared their payloads. pump_id was
      # wired end-to-end on the till and never added to the web builder, so
      # every web fuel sale wrote NULL, the exact-tank deduction never fired and
      # fuel reports read zero — the symptom the till fix was written to close.
      # Fails when the server reads a field exactly one client sends.
      - name: Client payload parity (desktop vs web)
        run: node scripts/check-client-parity.mjs

      # The parser is regex-based, so its own failure mode is finding nothing and
      # reporting perfect parity. It exits 2 below its parse floor; this asserts
      # that guard is alive rather than trusting it.
      - name: Assert parity guard detects a broken parse
        run: |
          if PARITY_MIN_SHARED=999 node scripts/schema-parity.mjs > /dev/null 2>&1; then
            echo "parity guard did not fire — it would pass on a broken parse"
            exit 1
          fi

      # Every endpoint the dashboard calls must exist on the server with a
      # matching method. A renamed route or GET-called-as-POST otherwise 404/405s
      # only in the browser. (A133 review surfaced this class was unchecked.)
      # No deps: pure file parsing, so it runs in this job. The DB-backed schema
      # drift gate needs PGlite and runs in server-suites, after the root install.
      - name: API route contract (dashboard vs server)
        run: node scripts/check-api-routes.mjs

      # Regex parser: assert it still detects an injected break rather than
      # trusting a green that could mean "found nothing".
      - name: Assert API route guard detects injected drift
        run: node scripts/check-api-routes.mjs --self-test

  server-suites:
    # tests/*.test.mjs — 18 suites covering the money paths (atomic order, tip
    # reconciliation, /pay claim-and-loyalty, stock effects parity, discount
    # ceiling, offline dating) and the auth resolution bugs.
    #
    # NONE of these ran in CI until 2026-08-09. They were written one per
    # incident, passed on the author's machine, and were then never executed
    # again — so every one of them was decoration the moment its session ended.
    # A test nothing runs is worth about as much as no test (rule 10).
    #
    # These are offline model/unit suites: no server, no database, no secrets.
    # tests/suites/ and tests/runner.mjs are the INTEGRATION half and are
    # deliberately excluded — they need a live API and owner credentials.
    name: Server suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      # report-downloads (A467) builds a report workbook with the dashboard's own
      # xlsx and reads it back — the same library the Download Excel button loads.
      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      # order-error-classification imports apps/server/dist, so that it drives
      # the SHIPPED classifier rather than a copy of it that can drift.
      - name: Build server
        working-directory: apps/server
        run: npm run build

      # EVERY migration test, against a real Postgres. PGlite is Postgres
      # compiled to WASM — real parser, planner and DDL semantics, in-process.
      #
      # This repository has tested migrations this way since migration 41 and
      # had six such scripts by 2026-08-10, none of which ran in CI. The cost
      # was exactly what a test nothing invokes always costs:
      #   * test-migration-47.mjs pointed at an absolute sandbox path and had
      #     never run since the day it was committed — 19 dead assertions.
      #   * Migration 74 shipped a CREATE OR REPLACE VIEW that Postgres refuses
      #     (42P16) and reached the owner's database.
      #
      # The runner discovers scripts/test-migration*.mjs rather than listing
      # them, so a new one is covered by existing.
      - name: Migrations against real Postgres
        run: |
          npm install --no-audit --no-fund
          node scripts/run-migration-tests.mjs --self-test
          npm run test:migrations

      # Server DB refs (supabase.from/.rpc/filter-columns) vs the schema the
      # migrations build in PGlite. Runs here because it needs the root install
      # above (@electric-sql/pglite). Found stock_movements.business_id and
      # users.pin (A136); self-test asserts the guard still detects injected drift.
      - name: API schema drift (server DB refs vs migrations)
        run: |
          node scripts/check-api-schema-drift.mjs
          node scripts/check-api-schema-drift.mjs --self-test

      # A549 — Analytics v1 (premium): the routes over HTTP with their aggregates answered by the REAL migration-158
      # functions in PGlite (flag off, branch scope, another business, the 366-day cap, the matrix, the heatmap in EAT,
      # the void-rate flag, credit ageing FIFO, costs withheld, the cache), the pure rules and insight sentences, and the
      # migration on its own. Needs the server build and the root install (PGlite) above.
      - name: Analytics v1 (A549) routes, rules and migration 158
        run: |
          node --no-warnings tests/analytics-a549.test.mjs
          node --no-warnings tests/analytics-rules-a549.test.mjs
          node --no-warnings scripts/test-migration-158.mjs

      # A553 — Analytics v2: GET /api/analytics/overview over HTTP (the daily series against the previous period, the
      # KPIs, the payment mix, costs withheld, branch scope, the cache) on the REAL migration-158/160 functions in PGlite,
      # the pure transforms (the server's rules and the page's chart maths and palette, read as TypeScript), and
      # migration 160 on its own. Needs the server build and the root install (PGlite) above.
      - name: Analytics v2 (A553) overview, chart transforms and migration 160
        run: |
          node --no-warnings tests/analytics-a553.test.mjs
          node --no-warnings tests/analytics-rules-a553.test.mjs
          node --no-warnings scripts/test-migration-160.mjs

      # A558 — Analytics "decisions made easy": GET /api/analytics/item-times (what sells when: the dayparts at the EAT
      # boundary, the owner's cut-off, branch scope, the cache) and /recommendations ("Do this next" and "How was this
      # period?": ranked estimates, costs withheld) over HTTP on the REAL migration-158/160/161 functions in PGlite; every
      # recommendation rule and the page's plain-words maths; migration 161 on its own. Needs the server build and PGlite.
      - name: Analytics decisions (A558) item times, recommendations and migration 161
        run: |
          node --no-warnings tests/analytics-a558.test.mjs
          node --no-warnings tests/analytics-rules-a558.test.mjs
          node --no-warnings scripts/test-migration-161.mjs

      # A560 — Analytics suggests what to stock, never a price rise; a cashier's voids a warning only: every stock rule
      # (the weekday uplift, the suggested quantity, running low with and without stock levels, the week at a glance, the
      # slow movers), the ranking, the value line, and no generated text that says price or raise. The HTTP side (stock
      # levels per branch, recipes left out) runs in the A558 step above. Needs the server build.
      - name: Analytics what to stock (A560) rules
        run: node --no-warnings tests/analytics-rules-a560.test.mjs

      # A561 — Analytics: how fast stock goes, who comes back, costs and margins, the items without a cost, and the area
      # tiles: GET /api/analytics/stock, /customers, /costs over HTTP on the REAL migration-158/160/161/162 functions in
      # PGlite (branch scope, costs and customers withheld, the cache, the cut-off, 503 before 162 while /recommendations
      # still answers); every new rule (run out, wastage, regulars gone quiet, food cost, thin margin, cost rise, the tiles'
      # hooks, the 10-row caps, no price wording) and the page's tile helpers; migration 162 on its own. Needs the server
      # build and PGlite.
      - name: Analytics stock, customers and costs (A561) and migration 162
        run: |
          node --no-warnings tests/analytics-a561.test.mjs
          node --no-warnings tests/analytics-rules-a561.test.mjs
          node --no-warnings scripts/test-migration-162.mjs

      # A565 — Analytics suggests moving stock between branches and flags a branch that falls behind: GET
      # /api/analytics/branches and the move / falling-branch cards in /recommendations over HTTP on the REAL
      # migration-158/160/161/162 functions in PGlite (the owner and a partner of every branch only; one active branch;
      # before 162; the cache shared per branch; no quantity or score sent), and every rule (short and surplus, the
      # internal 14-day floor, the minimum data, grouping, no numbers in the words, the ranking and the run-out de-dupe, the
      # 10-point gap, the tile). Needs the server build and PGlite.
      - name: Analytics between branches (A565)
        run: |
          node --no-warnings tests/analytics-a565.test.mjs
          node --no-warnings tests/analytics-rules-a565.test.mjs

      # A572 — Analytics cards readable at every width: the Payment mix legend (name, amount and % never overlap or clip;
      # it wraps below the donut in a narrow card) and the week at a glance (body-size text, whole item names on two
      # lines, 7 across only from 1800px, stacked on a phone, today ringed). Source pins on charts.tsx and AnalyticsPage.tsx.
      - name: Analytics legend and week cards (A572)
        run: node --no-warnings tests/analytics-visuals-a572.test.mjs

      # A583 — Analytics > Costs scrolled into an empty band: an sr-only header (position:absolute) escaped the dashboard's
      # 100dvh layout and made the WINDOW scroll. <main> is `relative` (the containing block of what a page places
      # absolutely), the Costs table's sr-only cell is too; plus the per-area error panel with Retry. Source pins.
      - name: Analytics Costs layout (A583)
        run: node --no-warnings tests/analytics-costs-layout-a583.test.mjs

      # A575 — "What sells together" (the product pairs bought in the same order; migration 164's analytics_together):
      # the rules (too few orders, the direction and the plain sentence, the ranking and the cap at 10, at most two cards,
      # no price and no KES, each business type's advice — a combo, the same shelf, at the pumps) and Analytics, Help and
      # the upload template in each business type's words; GET /api/analytics/together and its cards over HTTP on the REAL
      # function in PGlite (the flag, a manager's branch, before 164, the cache); the section and the Costs area rendered;
      # migration 164 on its own. Needs the server build and PGlite.
      - name: Analytics what sells together (A575) and migration 164
        run: |
          TZ=UTC node --no-warnings tests/analytics-together-a575.test.mjs
          node --no-warnings scripts/test-migration-164.mjs

      # A569 — a one-month cloud trial starts with the client's first desktop licence: the real admin and business routers
      # over HTTP (the trial starts with no invoice, once per client, never for a paid client; Convert to paid), the lapse
      # (a week of reports only, then CLOUD_TRIAL_ENDED), the owner's notice in the last 7 days, the admin portal's words.
      # A570 — Download ZapTill from the admin portal through our server: the source (our download server wins; GitHub with
      # the token and octet-stream; neither → 503), admin only, one-use links, streamed, audited, 404 for an unknown version.
      # Need the server build.
      - name: Cloud trial (A569) and Download ZapTill (A570)
        run: |
          node --no-warnings tests/cloud-trial-a569.test.mjs
          node --no-warnings tests/installer-download-a570.test.mjs

      # A581 — the cloud payment plan per business: month maths (31 Jan → 28/29 Feb), one period from the later of today and
      # paid-until (no lost days), Record payment over HTTP (invoice, web access on, audited, a trial converted, an M-Pesa
      # code once only, super admin only); a lapsed business's till writes → 503 CLOUD_SUBSCRIPTION_ENDED (its reads, a web
      # write, a client in its 21-day grace and a client not on the plan untouched), no till joins until paid, sync resumes
      # at once after the payment; reminders to the owner AND ZapTill once per milestone (14/7/3/1 days, the day, weekly
      # while lapsed), no provider → logged and skipped; the owner's notice, the admin list's expiry and filter; migration
      # 170 replayed into PGlite. Need the server build.
      - name: Cloud payment plan (A581) and migration 170
        run: |
          node --no-warnings tests/cloud-plan-a581.test.mjs
          node --no-warnings scripts/test-migration-170.mjs

      # A584 — one set of billing rules for every business with an expiry date: the lock at 00:00 Nairobi after the 7th
      # unpaid day (no grace, no reports-only stage for a paid client); the invoice on the due day (monthly and 12 months,
      # month ends) once per period, its email without a word of a lock; the bridge of licence expiries set before the plan
      # (put on a plan, audited, invoiced from the bridge day — never locked by a deploy; no expiry → unchanged and listed);
      # ZapTill-only notices (day 5, the lock, the digest); over HTTP the web paused (403 CLOUD_ACCESS_PAUSED), till writes
      # 503, no till joins, and a payment restoring all at once (covering the invoiced period, the invoice marked paid, a
      # receipt); "Enable web access" retired; the complimentary paid-until; the dashboard's paused screen. Migration 172
      # replayed into PGlite. Need the server build.
      - name: Cloud billing - invoice, 7-day lock, bridge (A584) and migration 172
        run: |
          node --no-warnings tests/billing-a584.test.mjs
          node --no-warnings scripts/test-migration-172.mjs

      # A587 — the owner's billing and credit decisions of 2026-10-24: pay as you go (a locked client who pays starts a fresh
      # period; the locked time's invoices closed, not charged; within the 7 days the period continues); "Not interested"
      # after 3 months unpaid (invoices written off, ZapTill once, still locked, a fresh start if it pays); a trial invoiced
      # at its end like a paid client; the bridge keeping an already-locked licence locked; Disable a hard off; General
      # Managers and partners (at one of their branches) set credit limits; with approval ON only the chosen approvers
      # confirm or dispute a waiting credit sale. Migration 173 replayed into PGlite. Need the server build.
      - name: Billing pay as you go, not interested, hard off; credit GM / partner / approvers (A587) and migration 173
        run: |
          node --no-warnings tests/billing-credit-a587.test.mjs
          node --no-warnings scripts/test-migration-173.mjs

      # A550: partner login — someone on the staff the owner lets into the web dashboard with a password, never the owner
      # (the real auth / staff routers over HTTP) — and the five built-in roles that came with it. They run in the loop
      # below too; named here so a failure says what broke.
      - name: Partner login and partner roles (A550)
        run: |
          node --no-warnings tests/partner-login-a550.test.mjs
          node --no-warnings tests/partner-roles-a550.test.mjs

      # A603: "Partner" in the Role list of + Add Staff — the owner's alone: the General Manager role and web dashboard
      # access in one step (the same grant as "Give web access"), all or nothing; the dashboard's list RUN from source.
      - name: Partner from the Role list (A603)
        run: node --no-warnings tests/partner-add-a603.test.mjs

      # A608: sign-in by role — Partner / General Manager email only, a Manager email (web dashboard) and a PIN for the
      # desktop POS, a Cashier a PIN; the web POS refuses a manager's PIN (USE_WEB_DASHBOARD), the desktop's /verify-pin untouched.
      - name: Staff sign-in by role (A608)
        run: node --no-warnings tests/staff-signin-by-role-a608.test.mjs

      # A582 — "All my branches": a partner of SOME branches (two or more) reads them combined, never another branch. The
      # whole cloud (routes/index.js behind the real requireAuth) over HTTP: X-Branch-Id 'mine' → exactly their list (never
      # null / every branch), forged values (another branch, 'all', '', NO_BRANCH) never reach it; ~120 reads (reports and
      # CSV exports, orders and search, shifts, day close, stock, money, notifications, the watch list, staff, branches,
      # devices, every analytics area on the REAL SQL through migration 171 in PGlite) never carry a row, total, count or
      # name of the other branch, in a set and with it forged in ?branch_id= / ?branch=; totals are theirs combined;
      # one-branch reads say "Pick one of your branches"; a write in a set is refused before any route. The dashboard's
      # picker ("All my branches (3)" first, never "All Branches") rendered, and what it remembers. Migration 171 on its
      # own (every function as before without p_branches; a set never carries the other branch). Need the server build
      # and PGlite.
      - name: Partner "All my branches" (A582) and migration 171
        run: |
