# CI for SwiftPOS.
#
# Nothing was running on push before this file existed — no type-check, no build,
# no test, no secret scan. Start here; add the E2E suite (e2e/) once it has a
# CI-reachable environment to point at.

name: CI

on:
  # dev is where work lands; main is what the tills run. CI must gate BOTH, and
  # dev especially — a check that only fires on a PR to main lets a broken commit
  # sit on dev for a week, and by then the failure is buried under later work.
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same branch — Render free tier + long installs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches apps/server engines.node
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json

      # Each app has its own lockfile — there is no workspace root, so install
      # them separately. (See REVIEW: consolidating these into one pnpm/npm
      # workspace is a recommended follow-up.)
      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs server dashboard

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/dashboard/package-lock.json

      - name: Install server deps
        working-directory: apps/server
        run: npm ci

      - name: Build server
        working-directory: apps/server
        run: npm run build

      # `npm run build` runs `tsc` with noEmitOnError — a type error fails the
      # build and emits nothing (it used to end in `|| true` and could not fail).
      # This assert is belt-and-braces so a green deploy always has an entrypoint.
      - name: Assert server build emitted an entrypoint
        working-directory: apps/server
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js was not emitted — the build silently failed"; exit 1; }
          echo "dist/index.js present ($(wc -c < dist/index.js) bytes)"

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan commits

      # This repo previously leaked a hardcoded Ed25519 signing key to a public
      # remote (see handoffs/handoff-14-07-2026.md §1). This job is the guardrail
      # that makes a repeat fail loudly instead of quietly.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: fail if a real .env is ever committed.
      - name: Assert no committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Real .env file(s) tracked in git:"; echo "$found"; exit 1
          fi
          echo "No tracked .env files."

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # supabase-js types `.from('x')` as `any`, so tsc is structurally blind to
      # a select or insert naming a column that does not exist. Everything below
      # catches the class tsc cannot: it is the only gate on schema drift.

      # `.catch()` on a PostgrestFilterBuilder throws TypeError at runtime. Fixed
      # and regressed at least three times — see the script header.
      - name: No .catch() on Supabase builders
        run: node scripts/check-supabase-catch.mjs

      # Cross-checks every select/insert against scripts/schema-index.json.
      # NB: regenerate that index whenever the schema changes, or this job
      # silently checks against a stale picture and stops being worth reading.
      - name: Schema audit
        run: python3 scripts/schema-audit.py --strict

      # Postgres vs the till's SQLite. Sync moves DATA only and never reconciles
      # STRUCTURE, so the two schemas drift by hand — `shifts` carried
      # closed_by/close_method locally for months with neither column in Postgres.
      #
      # Fails only on divergence that actually breaks sync: a NOT NULL column
      # with no default that the till cannot fill, or a local-only column on a
      # PUSH table. Both reject /api/sync/push on every pass, so a terminal stops
      # syncing entirely — and it surfaces at 06:00, not at deploy.
      #
      # Warnings (a Postgres column the till simply does not populate) do NOT
      # fail: that is a feature the terminal has not implemented, not a fault.
      #
      # Unlike the audit above, this derives from migrations/*.sql rather than
      # from schema-index.json — that index is hand-maintained and is the very
      # artefact that went stale for eleven days.
      - name: Schema parity (Postgres vs desktop SQLite)
        run: node scripts/schema-parity.mjs

      # Every table created in a migration must say what its RLS is. Migration 29
      # enabled RLS across the board, then 44 and 45 created three tables that
      # said nothing and went unprotected for a day — and this check's first run
      # also turned up branch_prices, which migration 29 had simply missed since
      # migration 20. verify_rls_coverage.sql tests the real database and is the
      # stronger check, but it needs credentials CI does not have; this needs
      # none, so it actually runs. Run both.
      - name: RLS coverage (migrations)
        run: node scripts/check-rls-coverage.mjs

      # The parser is regex-based, so its own failure mode is finding nothing and
      # reporting perfect parity. It exits 2 below its parse floor; this asserts
      # that guard is alive rather than trusting it.
      - name: Assert parity guard detects a broken parse
        run: |
          if PARITY_MIN_SHARED=999 node scripts/schema-parity.mjs > /dev/null 2>&1; then
            echo "parity guard did not fire — it would pass on a broken parse"
            exit 1
          fi

  desktop-scope:
    name: Desktop row scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20, for node:sqlite — the rejection-routing test needs a real
          # SQLite and better-sqlite3's native binding cannot be built in every
          # environment. The two lint guards below run on either.
          node-version: 22

      # The executable tests below prefer better-sqlite3 — the driver the till
      # actually runs — and fall back to node:sqlite only if it is missing. CI
      # installs it so the assertions are proved against the real engine rather
      # than a compatible one. --no-save keeps it out of the manifest; it is a
      # test dependency of the checks, not of the product.
      - name: Install the app's SQLite driver for the tests
        run: npm i --no-save better-sqlite3

      # Both guards below exist because a till acting as the branch node ingests
      # its peers' rows into the SAME tables that drive its own cash control.
      # Neither failure is visible to tsc, and both appear on exactly one till
      # per branch — which is to say a client finds them, not us.

      # Every query on a replicated table must either scope to this terminal or
      # carry `-- branch-wide: <why>`. getOpenShift() is the reason: unscoped, it
      # returns the newest open drawer anywhere at the branch, and the sell gate
      # reads it.
      - name: Own-row scope declared
        run: node scripts/check-own-rows.mjs

      # Scoping a query means adding a `?`. Adding a `?` without an argument
      # type-checks perfectly and then throws "Too few parameter values were
      # provided" at runtime. Eleven such statements reached the repo on the
      # first pass of the scoping work, and every one on the cash-push path.
      - name: SQL placeholders are bound
        run: node scripts/check-sql-binds.mjs

      # A scoped SELECT and an unattributed INSERT are each individually correct
      # and only wrong together, which is the shape no single-statement check
      # catches. Schema 44 scoped every read of expenses and float_transactions on
      # device_id and left both INSERT sites not setting it — so from that upgrade
      # on, expenses and drawer floats silently stopped reaching the server.
      - name: Replicated rows are attributed
        run: node scripts/check-row-attribution.mjs

      # The rejection block, executed. The server names the table a refused row
      # belongs to; applying every rejection to `shifts` matched zero rows for a
      # business_day, raised nothing, and the row was then marked synced — a
      # refused trading day recorded as delivered and never retried. No lint or
      # type-check can see that. This runs it.
      - name: Sync rejection routing
        run: node --no-warnings scripts/test-sync-rejection-routing.mjs

      # The ingest rules, executed. Every one of them is a case where continuing
      # would produce a plausible and incorrect number rather than an error — a
      # peer's shift attributed to the node, a cursor that skips a row, a counter
      # derived from another terminal's sequence. None is visible to a type-check.
      - name: Branch replication ingest
        run: node --no-warnings scripts/test-node-ingest.mjs
