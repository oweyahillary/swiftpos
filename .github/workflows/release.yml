# Desktop release (register D3 / A1) — build the PROD till on Windows and publish
# it to GitHub Releases so installed tills auto-update (electron-updater polls the
# feed this uploads: the installer .exe, its .blockmap, and latest.yml).
#
# TRIGGER: a version tag `v*` (e.g. v0.5.40). Never on push — that would cut a
# release every commit. Cut a release by tagging:
#     cd apps/desktop && npm version patch            # bumps + commits + tags on the desktop
#     # or tag by hand at the repo root:  git tag v0.5.40 && git push origin v0.5.40
#
# UNSIGNED for now: the loop works; Windows SmartScreen shows on first install
# until a signing cert is added. To sign, add repo secrets CSC_LINK (base64 .pfx
# or a path) + CSC_KEY_PASSWORD and they are picked up automatically — no workflow
# change needed. See docs/DESKTOP-AUTOUPDATE.md §4.
name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write           # gh creates the GitHub Release and uploads its files (A590: after the native gate)

jobs:
  release:
    name: Build + publish (Windows, prod)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-10-02: the tag must point at the commit that carries its version. v0.6.32 was first pushed on main's A376
      # merge (still 0.6.31): three runs built a 0.6.31 installer, uploaded it over the v0.6.31 release and failed only at
      # the last check. Stop in seconds instead, and say how to tag.
      - name: Check the tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "$V" ]; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), whose apps/desktop/package.json is $PKG, not $V. Tag the commit that carries $V: git fetch origin && git push origin origin/dev:refs/tags/$TAG (delete the wrong tag first: git push origin :refs/tags/$TAG)"
            exit 1
          fi
          echo "OK - $TAG is version $PKG ($(git rev-parse --short HEAD))."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The desktop imports @swiftpos/printing (a file: dependency) — build it first.
      - name: Build shared/printing
        working-directory: shared/printing
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build main + renderer (prod flavour)
        working-directory: apps/desktop
        env:
          SWIFTPOS_ENV: prod
        run: npm run build:all

      - name: Verify build artefacts exist
        working-directory: apps/desktop
        run: npm run assert:built

      # A350: create the GitHub release BEFORE electron-builder uploads to it. Left to electron-builder, its parallel
      # uploads each found no release and each created one — v0.6.15 and v0.6.16 were split into two releases with the
      # three updater files divided between them (the tag's public download link then pointed at the half without
      # latest.yml). With the release already there, every upload finds it and lands in the same one.
      - name: Create the GitHub release first (one release per tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - the build uploads into it."
            # 2026-10-02: deleting a tag turns its release into a DRAFT; a re-tag then uploaded v0.6.32 into the draft,
            # which tills cannot download. Publish it again (still a pre-release - held until approved).
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
              echo "Release $TAG was a draft - published (pre-release)."
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "${TAG#v}" \
              --notes "Desktop ${TAG#v}. Held for every client until approved in the admin portal (Desktop updates)."
          fi

      # A590 (P0): the 32-bit app of every combined installer up to 1.0.20 had no SQLite driver for its arch
      # (better-sqlite3 13 ships no win32-ia32 prebuild and its binding.gyp built nothing on an x64 host). Compile it
      # here, in its own step, so a compiler failure is plain in the log (electron-builder's beforePack would also build
      # it; this makes it explicit). x64 uses the prebuild better-sqlite3 ships — checked, not built.
      - name: Build the 32-bit SQLite driver; check the 64-bit one (A590)
        working-directory: apps/desktop
        shell: bash   # bash -e: either line failing fails the step (pwsh would only see the last exit code)
        run: |
          node scripts/native-driver.mjs ensure ia32
          node scripts/native-driver.mjs ensure x64

      # Build the NSIS installer (installer + .blockmap + latest.yml) WITHOUT uploading anything (A590): nothing reaches
      # GitHub until the gate below has seen both arches load their SQLite driver. SWIFTPOS_ENV=prod so the publish
      # config in electron-builder.config.js is active — it is what writes latest.yml (dev flavour publishes nowhere).
      - name: Build the installer (no upload yet)
        working-directory: apps/desktop
        env:
          SWIFTPOS_ENV: prod
          # CSC_LINK / CSC_KEY_PASSWORD: add as repo secrets to sign (optional today).
        # 0.6.32: --x64 --ia32 → ONE installer for 64-bit and 32-bit Windows (ZapTill-<version>.exe).
        run: npx electron-builder --win nsis --x64 --ia32 --config electron-builder.config.js --publish never

      # A590 HARD GATE: each arch's own packaged ZapTill.exe (ELECTRON_RUN_AS_NODE=1 — the 32-bit exe runs on this 64-bit
      # runner) must require better-sqlite3 from its app.asar and open ':memory:' — the unpacked apps AND the payloads
      # inside the installer that is about to be uploaded. Any failure stops the job here: nothing is published.
      - name: Gate - the SQLite driver loads on 64-bit and 32-bit (A590)
        working-directory: apps/desktop
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          node scripts/native-gate.mjs dir release/win-unpacked x64
          node scripts/native-gate.mjs dir release/win-ia32-unpacked ia32
          node scripts/native-gate.mjs installer "release/ZapTill-$V.exe"

      # Publish ONLY after the gate: the exact files electron-builder used to upload, under the same names — the
      # installer, its .blockmap, then latest.yml LAST (the cloud's update feed, lib/desktopReleases.ts, treats a release
      # as complete once latest.yml + the .exe are there, so latest.yml never lands before the installer it names).
      # --clobber replaces them on a re-run. A manual run (no tag) publishes to v<version>, as electron-builder did.
      - name: Publish to GitHub Releases (after the gate)
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$V"; fi
          for f in "release/ZapTill-$V.exe" "release/ZapTill-$V.exe.blockmap" release/latest.yml; do
            [ -f "$f" ] || { echo "::error::$f was not built"; exit 1; }
          done
          grep -qxF "path: ZapTill-$V.exe" release/latest.yml || { echo "::error::release/latest.yml does not name ZapTill-$V.exe"; exit 1; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$V" \
              --notes "Desktop $V. Held for every client until approved in the admin portal (Desktop updates)."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "release/ZapTill-$V.exe" "release/ZapTill-$V.exe.blockmap"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/latest.yml
          echo "Published ZapTill-$V.exe, its .blockmap and latest.yml to $TAG."

      # A350: fail loudly unless the tag has exactly ONE release carrying latest.yml and the installer — a split or a
      # missing file is caught here, on the release run, not by an owner opening GitHub or a till that cannot update.
      - name: Verify the release (one published copy, latest.yml + installer)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          COPIES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name")
          echo "Releases for $TAG: $COPIES"; echo "$NAMES"
          [ "$COPIES" = "1" ] || { echo "::error::$COPIES releases exist for $TAG - expected exactly one."; exit 1; }
          # A draft is invisible to tills (its files need a signed-in GitHub user) - publish it on GitHub.
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          [ "$DRAFT" = "false" ] || { echo "::error::$TAG is a DRAFT - tills cannot download it. Publish it on GitHub (Releases > Edit > Publish, keep pre-release)."; exit 1; }
          # 0.6.32: the combined 64-bit + 32-bit installer is SwiftPOS-<version>.exe (before: SwiftPOS-<version>-x64.exe).
          # 0.6.36 (A386): the installer is ZapTill-<version>.exe (SwiftPOS-<version>.exe before).
          for f in latest.yml "ZapTill-$V.exe"; do
            echo "$NAMES" | grep -qxF "$f" || { echo "::error::$TAG is missing $f"; exit 1; }
          done
          # The blockmap only serves differential downloads, which 0.6.16+ tills do not use (autoUpdate.ts) — warn only.
          echo "$NAMES" | grep -qxF "ZapTill-$V.exe.blockmap" || echo "::warning::$TAG has no .blockmap (not needed by 0.6.16+ tills)"
          echo "OK - $TAG is one release with latest.yml and the installer."
