# Desktop release (register D3 / A1) — build the PROD till on Windows and publish
# it to GitHub Releases so installed tills auto-update (electron-updater polls the
# feed this uploads: the installer .exe, its .blockmap, and latest.yml).
#
# TRIGGER: a version tag `v*` (e.g. v0.5.40). Never on push — that would cut a
# release every commit. Cut a release by tagging:
#     cd apps/desktop && npm version patch            # bumps + commits + tags on the desktop
#     # or tag by hand at the repo root:  git tag v0.5.40 && git push origin v0.5.40
#
# UNSIGNED for now: the loop works; Windows SmartScreen shows on first install
# until a signing cert is added. To sign, add repo secrets CSC_LINK (base64 .pfx
# or a path) + CSC_KEY_PASSWORD and they are picked up automatically — no workflow
# change needed. See docs/DESKTOP-AUTOUPDATE.md §4.
name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write           # electron-builder needs this to create the GitHub Release

jobs:
  release:
    name: Build + publish (Windows, prod)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The desktop imports @swiftpos/printing (a file: dependency) — build it first.
      - name: Build shared/printing
        working-directory: shared/printing
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build main + renderer (prod flavour)
        working-directory: apps/desktop
        env:
          SWIFTPOS_ENV: prod
        run: npm run build:all

      - name: Verify build artefacts exist
        working-directory: apps/desktop
        run: npm run assert:built

      # A350: create the GitHub release BEFORE electron-builder uploads to it. Left to electron-builder, its parallel
      # uploads each found no release and each created one — v0.6.15 and v0.6.16 were split into two releases with the
      # three updater files divided between them (the tag's public download link then pointed at the half without
      # latest.yml). With the release already there, every upload finds it and lands in the same one.
      - name: Create the GitHub release first (one release per tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - the build uploads into it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "${TAG#v}" \
              --notes "Desktop ${TAG#v}. Held for every client until approved in the admin portal (Desktop updates)."
          fi

      # Build the NSIS installer AND publish it (installer + .blockmap + latest.yml)
      # to the GitHub Release for this tag. GITHUB_TOKEN is provided by Actions.
      # SWIFTPOS_ENV=prod so the publish target in electron-builder.config.js is active
      # (dev flavour publishes nowhere).
      - name: Build + publish to GitHub Releases
        working-directory: apps/desktop
        env:
          SWIFTPOS_ENV: prod
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A350: upload into the release created above even on a re-run more than 2 hours later (electron-builder
          # otherwise refuses an existing release published over 2 hours ago).
          EP_GH_IGNORE_TIME: 'true'
          # CSC_LINK / CSC_KEY_PASSWORD: add as repo secrets to sign (optional today).
        # 0.6.32: --x64 --ia32 → ONE installer for 64-bit and 32-bit Windows (SwiftPOS-<version>.exe).
        run: npx electron-builder --win nsis --x64 --ia32 --config electron-builder.config.js --publish always

      # A350: fail loudly unless the tag has exactly ONE release carrying latest.yml and the installer — a split or a
      # missing file is caught here, on the release run, not by an owner opening GitHub or a till that cannot update.
      - name: Verify the release (one copy, latest.yml + installer)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          COPIES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name")
          echo "Releases for $TAG: $COPIES"; echo "$NAMES"
          [ "$COPIES" = "1" ] || { echo "::error::$COPIES releases exist for $TAG - expected exactly one."; exit 1; }
          # 0.6.32: the combined 64-bit + 32-bit installer is SwiftPOS-<version>.exe (before: SwiftPOS-<version>-x64.exe).
          for f in latest.yml "SwiftPOS-$V.exe"; do
            echo "$NAMES" | grep -qxF "$f" || { echo "::error::$TAG is missing $f"; exit 1; }
          done
          # The blockmap only serves differential downloads, which 0.6.16+ tills do not use (autoUpdate.ts) — warn only.
          echo "$NAMES" | grep -qxF "SwiftPOS-$V.exe.blockmap" || echo "::warning::$TAG has no .blockmap (not needed by 0.6.16+ tills)"
          echo "OK - $TAG is one release with latest.yml and the installer."
