<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapTill feature — Kitchen (ticket hero)</title>
<link rel="stylesheet" href="posters.css">
<style>
  body{display:flex;flex-wrap:wrap;gap:40px;padding:40px;}
  .board{position:relative;overflow:hidden;color:#fff;font-family:var(--font-text);
    background:linear-gradient(135deg,#140b06 0%,#5c200d 34%,#9a3412 66%,#c2410c 100%);}
  .board.square{width:1080px;height:1080px;}
  .board.story{width:1080px;height:1920px;background:linear-gradient(160deg,#140b06 0%,#5c200d 38%,#9a3412 70%,#c2410c 100%);}
  .glowtop{position:absolute;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(163,230,53,.38),transparent 70%);}
  .dots{position:absolute;z-index:0;opacity:.5;background-image:radial-gradient(#ffffff 2.6px,transparent 2.7px);background-size:30px 30px;}
  .brand{display:flex;align-items:center;gap:.5em;font-family:var(--font-display);font-weight:700;font-size:33px;letter-spacing:-.01em;}
  .brand img{width:48px;height:48px;border-radius:24%;} .brand i{font-style:italic;color:#bef264;}
  .tag{font-family:var(--font-text);font-size:17px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#1a2e05;background:#a3e635;border-radius:999px;padding:.6em 1.15em;}
  .top{position:absolute;z-index:4;display:flex;justify-content:space-between;align-items:center;}
  .h{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;line-height:.96;}
  .h em{font-style:italic;color:#bef264;}
  .sub{line-height:1.5;color:#ffedd5;font-weight:500;}
  .ticket{position:absolute;z-index:3;filter:drop-shadow(0 50px 70px rgba(0,0,0,.55));}
  .ticket img{width:100%;display:block;}
  .foot{position:absolute;z-index:4;display:flex;align-items:center;gap:20px;}
  .cta{display:inline-flex;align-items:center;background:#a3e635;color:#1a2e05;font-weight:800;padding:.72em 1.45em;border-radius:999px;box-shadow:0 16px 36px -12px rgba(163,230,53,.5);}
  .dom{color:#fed7aa;font-weight:600;}
  .square .top{left:84px;right:84px;top:80px;}
  .square .copy{position:absolute;left:84px;top:230px;z-index:4;width:520px;}
  .square .h{font-size:98px;} .square .sub{font-size:26px;max-width:13em;margin-top:26px;}
  .square .ticket{right:-36px;bottom:116px;width:700px;transform:rotate(-4deg);}
  .square .foot{left:84px;bottom:76px;} .square .cta{font-size:22px;} .square .dom{font-size:21px;}
  .square .glowtop{right:-20px;top:40px;width:660px;height:660px;} .square .dots{left:88px;bottom:250px;width:190px;height:130px;}
  .story .top{left:90px;right:90px;top:96px;}
  .story .copy{position:absolute;left:90px;right:90px;top:300px;z-index:4;text-align:center;}
  .story .h{font-size:118px;} .story .sub{font-size:31px;max-width:18em;margin:30px auto 0;}
  .story .ticket{left:140px;right:140px;top:46%;width:auto;transform:rotate(-3deg);}
  .story .foot{left:0;right:0;bottom:120px;justify-content:center;} .story .cta{font-size:27px;} .story .dom{font-size:26px;}
  .story .glowtop{right:-120px;top:-40px;width:760px;height:760px;} .story .dots{left:80px;bottom:360px;width:160px;height:150px;}
</style>
</head>
<body>
<div class="board square" id="feed"></div>
<div class="board story" id="story"></div>
<template id="tpl">
  <div class="glowtop"></div><div class="dots"></div>
  <div class="top"><span class="brand"><img src="assets/logo.png" alt="">Zap<i>Till</i></span><span class="tag">Kitchen</span></div>
  <div class="copy">
    <div class="h">Every order, <em>in writing</em>.</div>
    <div class="sub">A clean ticket prints the moment you send — the dish, the course, the notes. No shouting, no mix-ups.</div>
  </div>
  <div class="ticket"><img src="assets/kot-kitchen.png" alt="A ZapTill kitchen ticket for Table 4"></div>
  <div class="foot"><span class="cta">Book a demo&nbsp;→</span><span class="dom">zaptill.co.ke</span></div>
</template>
<script>
  var tpl=document.getElementById('tpl').innerHTML;document.getElementById('feed').innerHTML=tpl;document.getElementById('story').innerHTML=tpl;
  var h=location.hash;if(h==='#feed'||h==='#story'){document.body.style.cssText='margin:0;padding:0;gap:0;display:block';document.querySelectorAll('.board').forEach(function(b){b.style.display='none';});var el=document.querySelector(h==='#feed'?'.square':'.story');if(el){el.style.display='block';el.style.margin='0';}}
</script>
</body>
</html>
