<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapTill feature — Kitchen display (KDS)</title>
<link rel="stylesheet" href="posters.css">
<style>
  body{display:flex;flex-wrap:wrap;gap:40px;padding:40px;}
  .board{position:relative;overflow:hidden;color:#fff;font-family:var(--font-text);
    background:linear-gradient(135deg,#1a0e08 0%,#7c2d12 32%,#9a3412 56%,#ea580c 100%);}
  .board.square{width:1080px;height:1080px;}
  .board.story{width:1080px;height:1920px;background:linear-gradient(160deg,#1a0e08 0%,#7c2d12 36%,#9a3412 60%,#ea580c 100%);}
  .glowtop{position:absolute;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(163,230,53,.4),transparent 70%);}
  .dots{position:absolute;z-index:0;opacity:.5;background-image:radial-gradient(#ffffff 2.6px,transparent 2.7px);background-size:30px 30px;}
  .brand{display:flex;align-items:center;gap:.5em;font-family:var(--font-display);font-weight:700;font-size:33px;letter-spacing:-.01em;}
  .brand img{width:48px;height:48px;border-radius:24%;} .brand i{font-style:italic;color:#bef264;}
  .tag{font-family:var(--font-text);font-size:17px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#1a2e05;background:#a3e635;border-radius:999px;padding:.6em 1.15em;}
  .top{position:absolute;z-index:4;display:flex;justify-content:space-between;align-items:center;}
  .h{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;line-height:.96;}
  .h em{font-style:italic;color:#bef264;}
  .sub{line-height:1.5;color:#ffedd5;font-weight:500;}
  .device{z-index:3;padding:13px;border-radius:22px;background:#0b1220;border:1px solid rgba(255,255,255,.14);box-shadow:0 60px 110px -34px rgba(0,0,0,.65),0 0 90px -20px rgba(163,230,53,.35);}
  .device img{width:100%;display:block;border-radius:11px;}
  .foot{position:absolute;z-index:4;display:flex;align-items:center;gap:20px;}
  .cta{display:inline-flex;align-items:center;background:#a3e635;color:#1a2e05;font-weight:800;padding:.72em 1.45em;border-radius:999px;box-shadow:0 16px 36px -12px rgba(163,230,53,.5);}
  .dom{color:#fed7aa;font-weight:600;}
  .square .top{left:84px;right:84px;top:80px;}
  .square .copy{position:absolute;left:84px;top:190px;z-index:4;width:912px;}
  .square .h{font-size:92px;} .square .sub{font-size:26px;max-width:26em;margin-top:22px;}
  .square .device{position:absolute;left:70px;right:70px;top:560px;transform:perspective(2600px) rotateX(7deg) rotate(-1deg);}
  .square .foot{left:84px;bottom:70px;} .square .cta{font-size:22px;} .square .dom{font-size:21px;}
  .square .glowtop{right:-120px;top:-120px;width:640px;height:640px;} .square .dots{left:84px;bottom:90px;width:150px;height:90px;}
  .story .top{left:90px;right:90px;top:96px;}
  .story .copy{position:absolute;left:90px;right:90px;top:250px;z-index:4;text-align:center;}
  .story .h{font-size:116px;} .story .sub{font-size:31px;max-width:20em;margin:28px auto 0;}
  .story .device{position:absolute;left:44px;right:44px;top:860px;transform:perspective(2800px) rotateX(5deg) rotate(-1deg);}
  .story .foot{left:0;right:0;bottom:130px;justify-content:center;} .story .cta{font-size:27px;} .story .dom{font-size:26px;}
  .story .glowtop{right:-160px;top:40px;width:760px;height:760px;} .story .dots{left:0;right:0;bottom:430px;width:340px;height:120px;margin:0 auto;}
</style>
</head>
<body>
<div class="board square" id="feed"></div>
<div class="board story" id="story"></div>
<template id="tpl">
  <div class="glowtop"></div><div class="dots"></div>
  <div class="top"><span class="brand"><img src="assets/logo.png" alt="">Zap<i>Till</i></span><span class="tag">Kitchen display</span></div>
  <div class="copy">
    <div class="h">The kitchen sees <em>every order</em>.</div>
    <div class="sub">The moment you ring it, the dish lands on the kitchen screen — the course, the variant, the allergy note, all of it.</div>
  </div>
  <div class="device"><img src="assets/kds-screen.webp" alt="The ZapTill kitchen display screen with live tickets"></div>
  <div class="foot"><span class="cta">Book a demo&nbsp;→</span><span class="dom">zaptill.co.ke</span></div>
</template>
<script>
  var tpl=document.getElementById('tpl').innerHTML;document.getElementById('feed').innerHTML=tpl;document.getElementById('story').innerHTML=tpl;
  var h=location.hash;if(h==='#feed'||h==='#story'){document.body.style.cssText='margin:0;padding:0;gap:0;display:block';document.querySelectorAll('.board').forEach(function(b){b.style.display='none';});var el=document.querySelector(h==='#feed'?'.square':'.story');if(el){el.style.display='block';el.style.margin='0';}}
</script>
</body>
</html>
