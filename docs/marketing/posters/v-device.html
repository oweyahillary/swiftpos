<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapTill — Device</title>
<link rel="stylesheet" href="posters.css">
<style>
  body{display:flex;flex-wrap:wrap;gap:40px;padding:40px;}
  .board{width:1080px;height:1080px;position:relative;overflow:hidden;color:var(--text);
    background:radial-gradient(70% 60% at 50% 64%, #0d3236 0%, #072024 50%, #04141a 100%);}
  .glow{position:absolute;left:50%;top:60%;width:1000px;height:760px;transform:translate(-50%,-50%);z-index:0;
    background:radial-gradient(closest-side, rgba(34,211,238,.3), rgba(99,102,241,.1) 55%, transparent 74%);}

  .top{position:absolute;left:86px;right:86px;top:78px;z-index:3;display:flex;justify-content:space-between;align-items:center;}
  .brand{display:flex;align-items:center;gap:.5em;font-family:var(--font-display);font-weight:800;font-size:33px;letter-spacing:-.02em;}
  .brand img{width:46px;height:46px;border-radius:24%;} .brand i{font-style:normal;color:var(--teal-light);}
  .tag{font-family:var(--font-text);font-size:17px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:var(--teal-light);
    border:1.5px solid rgba(94,234,212,.3);border-radius:999px;padding:.6em 1.1em;}

  .kicker{position:absolute;left:50%;top:170px;transform:translateX(-50%);z-index:3;
    font-family:var(--font-display);font-weight:800;font-size:58px;letter-spacing:-.025em;
    background:linear-gradient(135deg,#d4fff4,#5eead4 40%,#22d3ee 72%,#7aa6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

  .stage{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);z-index:2;perspective:2200px;}
  .device{width:940px;padding:16px;border-radius:30px;background:linear-gradient(150deg,#1b3034,#0b1d20);
    border:1px solid rgba(94,234,212,.2);transform:rotateX(4deg) rotateY(-11deg) rotate(-1.4deg);
    box-shadow:0 70px 120px -40px rgba(0,0,0,.8),0 30px 80px -40px rgba(20,184,166,.6),inset 0 1px 0 rgba(255,255,255,.07);}
  .device img{width:100%;display:block;border-radius:16px;}

  .icons{position:absolute;left:0;right:0;bottom:66px;z-index:3;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:.5em;background:rgba(10,34,38,.82);border:1px solid rgba(94,234,212,.26);
    border-radius:999px;padding:.6em 1em;font-family:var(--font-text);font-weight:600;font-size:21px;color:#eafaf7;backdrop-filter:blur(6px);}
  .chip .i{width:1.6em;height:1.6em;color:var(--teal-light);display:grid;place-items:center;}
  .chip svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div class="board">
  <div class="glow"></div>
  <div class="top">
    <span class="brand"><img src="assets/logo.png" alt="">Zap<i>Till</i></span>
    <span class="tag">Restaurant POS</span>
  </div>
  <div class="kicker">Introducing</div>

  <div class="stage">
    <div class="device"><img src="assets/pos-restaurant.webp" alt="ZapTill restaurant point of sale"></div>
  </div>

  <div class="icons">
    <span class="chip"><span class="i"><svg viewBox="0 0 24 24"><path d="M4.5 11.5a11 11 0 0 1 15 0"/><path d="M7.7 15a6.5 6.5 0 0 1 8.6 0"/><circle cx="12" cy="18.6" r="1.1" fill="currentColor" stroke="none"/></svg></span>Works offline</span>
    <span class="chip"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></span>M-Pesa &amp; cards</span>
    <span class="chip"><span class="i"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></span>Tables &amp; tabs</span>
    <span class="chip"><span class="i"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9 8h6M9 12h6"/></svg></span>Kitchen tickets</span>
  </div>
</div>
</body>
</html>
