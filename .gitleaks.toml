# Gitleaks configuration (register A107).
#
# Keeps the FULL default ruleset — real secrets must still fail CI — and
# allowlists confirmed false positives so benign internal strings can't block a
# merge. Each was inspected; none is a credential:
#   • escpos_default_on_0527                  — a maintenance_state feature-flag key
#   • 23456789ABCDEFGHJKMNPQRSTVWXYZ          — Crockford base32 alphabet (enrolment codes)
#   • refresh_token, logged_in_at=excluded…   — SQL column names in an UPSERT clause
#   • eyJhbGciOiJub25lIi…                      — an alg:"none" TEST-FIXTURE JWT that a
#                                               security test feeds in to prove it is REJECTED
#   • test-secret-for-a340-0123456789          — a made-up JWT signing key in the FIRST version of
#                                               tests/staff-role-ceiling.test.mjs (commit 08d63f5, A340);
#                                               the test now generates its keys at run time. Allowlisted
#                                               so a scan over that commit (e.g. a merge to main) passes.
#   • sOmEsIgNaTuRe_value-123, c2lnbmF0dXJlLXg — the signatures of two made-up JWTs in the A519 log-redaction
#                                               tests (apps/desktop/test/a519-till-items, tests/support-a519),
#                                               fed in to prove a support log is redacted before it is sent/stored.
# Matched on the exact benign strings (regexTarget = match), so real secrets are
# untouched and the suppression survives line/commit changes.

[extend]
useDefault = true

[allowlist]
description = "Confirmed false positives — internal constants, SQL identifiers, a test fixture."
regexTarget = "match"
regexes = [
  '''escpos_default_on_0527''',
  '''23456789ABCDEFGHJKMNPQRSTVWXYZ''',
  '''refresh_token, logged_in_at=excluded''',
  '''eyJhbGciOiJub25lIi''',
  '''test-secret-for-a340-0123456789''',
  '''sOmEsIgNaTuRe_value-123''',
  '''c2lnbmF0dXJlLXg''',
]
